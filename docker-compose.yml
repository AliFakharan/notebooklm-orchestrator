# NotebookLM Orchestrator — local single-user container.
#
#   docker compose up --build -d
#   → UI on http://127.0.0.1:4870 (host loopback only)
#
# Data (SQLite, job archives, vault, session cookies, xray vendor) persists in
# ./data. For live mode (real NotebookLM + xray tunnel), put your .env next to
# this file and make sure data/vendor/ has the xray binary + geo files.
# See docs/quick-start.md → section 3.

services:
  nlo:
    build: .
    container_name: nlo
    restart: unless-stopped
    # Run as your host uid/gid so the bind-mounted ./data stays writable
    # (default 1000:1000; override in .env if your uid differs).
    user: "${NLO_UID:-1000}:${NLO_GID:-1000}"
    ports:
      # Loopback only on purpose: the default trust boundary is the machine.
      # To expose further (e.g. "4870:4870"), the admin gate (required) plus
      # NLO_TRUSTED_IPS keep the browser UI working; an auth-capable reverse
      # proxy remains the safer option for shared hosts.
      - "127.0.0.1:${NLO_PORT:-4870}:4870"
    volumes:
      - ./data:/data
    # Compose interpolates these from the project's .env (same file as
    # bare mode) — set live-mode knobs there, e.g.:
    #   NLO_PROVIDER=python-worker
    #   NLO_PROXY_RUNTIME=xray
    #   NLO_PYTHON_BIN=/data/venv/bin/python
    environment:
      NLO_DATA_DIR: /data
      # 0.0.0.0 is required inside the container for Docker's port-forward;
      # it stays safe because only the host loopback is published above.
      # (Overrides NLO_HOST from your .env, if present.)
      NLO_HOST: 0.0.0.0
      NLO_PORT: "4870"
      NLO_PROVIDER: ${NLO_PROVIDER:-mock}
      NLO_PROXY_RUNTIME: ${NLO_PROXY_RUNTIME:-mock}
      # Pin to the venv baked into the image (/opt/nbl-venv). Do NOT interpolate
      # NLO_PYTHON_BIN here: in bare mode your .env points at a HOST path
      # (e.g. /home/.../data/venv/bin/python) which does not exist inside the
      # container and breaks worker spawn.
      NLO_PYTHON_BIN: /opt/nbl-venv/bin/python
      NLO_JOB_TIMEOUT_MS: ${NLO_JOB_TIMEOUT_MS:-1800000}
      # Admin credentials are REQUIRED: the server refuses to boot without
      # them (they power the /admin login and the API gate). Set them in .env.
      NLO_ADMIN_USER: ${NLO_ADMIN_USER:?NLO_ADMIN_USER is required}
      NLO_ADMIN_PASSWORD: ${NLO_ADMIN_PASSWORD:?NLO_ADMIN_PASSWORD is required}
      # Where host-browser requests arrive from inside the container
      # (default docker bridge gateway); keeps the public web UI working.
      NLO_TRUSTED_IPS: ${NLO_TRUSTED_IPS:-172.17.0.1}
    # Outbound internet is needed for live mode (xray tunnel to VLESS nodes).
    # Mock mode works fully offline.
